<p class="font-body-sm text-body-sm text-primary-fixed-dim mt-base">Law Enforcement Intelligence Platform</p>

<!-- Form Section -->
<section class="p-lg flex flex-col gap-md">
<div class="text-center">
<h2 class="font-headline-sm text-headline-sm text-on-surface mb-xs">Two-Factor Authentication Required</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Enter the 6-digit OTP sent to your registered device to continue.</p>
</div>
<form class="flex flex-col gap-md" onsubmit="event.preventDefault(); window.location.href='#';">
<!-- OTP Inputs -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="otp-1">One-Time Password</label>
<div class="flex justify-between gap-base" id="otp-container">
<input aria-label="Digit 1" class="w-full h-12 text-center font-data-mono text-headline-sm border border-outline-variant rounded bg-surface-container-lowest text-on-surface focus:outline-none focus:ring-2 focus:ring-tertiary-container focus:border-transparent transition-all" id="otp-1" maxlength="1" type="text"/>
<input aria-label="Digit 2" class="w-full h-12 text-center font-data-mono text-headline-sm border border-outline-variant rounded bg-surface-container-lowest text-on-surface focus:outline-none focus:ring-2 focus:ring-tertiary-container focus:border-transparent transition-all" id="otp-2" maxlength="1" type="text"/>
<input aria-label="Digit 3" class="w-full h-12 text-center font-data-mono text-headline-sm border border-outline-variant rounded bg-surface-container-lowest text-on-surface focus:outline-none focus:ring-2 focus:ring-tertiary-container focus:border-transparent transition-all" id="otp-3" maxlength="1" type="text"/>
<input aria-label="Digit 4" class="w-full h-12 text-center font-data-mono text-headline-sm border border-outline-variant rounded bg-surface-container-lowest text-on-surface focus:outline-none focus:ring-2 focus:ring-tertiary-container focus:border-transparent transition-all" id="otp-4" maxlength="1" type="text"/>

<input aria-label="Digit 6" class="w-full h-12 text-center font-data-mono text-headline-sm border border-outline-variant rounded bg-surface-container-lowest text-on-surface focus:outline-none focus:ring-2 focus:ring-tertiary-container focus:border-transparent transition-all" id="otp-6" maxlength="1" type="text"/>
</div>

<script>
        // Basic OTP input auto-advance logic
        const inputs = document.querySelectorAll('#otp-container input');
        
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1) {
                    if (index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value.length === 0) {
                    if (index > 0) {
                        inputs[index - 1].focus();
                    }
                }
            });
            
            // Allow only numbers
            input.addEventListener('keypress', (e) => {
                if (!/[0-9]/.test(e.key)) {
                    e.preventDefault();
                }
            });
        });
        
        // Simple countdown timer for demonstration
        let timeLeft = 165; // 2:45
        const countdownEl = document.getElementById('countdown');
        
        const timerId = setInterval(() => {
            if (timeLeft <= 0) {
                clearInterval(timerId);
                countdownEl.textContent = "00:00";
                countdownEl.classList.add('text-error');
            } else {
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                countdownEl.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                timeLeft--;
            }
        }, 1000);
    </script>
