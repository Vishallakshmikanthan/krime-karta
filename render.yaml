services:
  - type: web
    name: krimekarta-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: DEV_OTP
        value: "123456"
      - key: STORE_MIN_CRIMES
        value: "300"
